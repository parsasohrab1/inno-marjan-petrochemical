name: Dependency audit (pip-audit)

# ─────────────────────────────────────────────────────────────────────────────
# MRTO — weekly pip-audit + on-demand. Opens an issue on any HIGH/CRITICAL
# unfixed CVE so the operator can triage. Non-blocking on main.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Monday 06:00 UTC — start of week triage.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit against requirements.txt
        id: audit
        continue-on-step: true
        run: |
          set +e
          pip-audit -r backend/requirements.txt --strict \
            --desc on --format json > audit.json 2> audit.log
          code=$?
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          cat audit.log
          exit 0

      - name: Parse findings
        id: parse
        run: |
          python - <<'PY'
          import json, os
          code = int(os.environ.get("AUDIT_EXIT", "0"))
          try:
              with open("audit.json") as f:
                  data = json.load(f)
          except Exception:
              data = {"dependencies": []}
          highs = [d for d in data.get("dependencies", [])
                   if any(v.get("severity", "").lower() == "high" or "critical" in v.get("id","").lower()
                          for v in d.get("vulns", []))]
          print("high/critical findings:", len(highs))
          with open("summary.md", "w") as f:
              f.write(f"# pip-audit summary\n\n")
              f.write(f"- exit code: {code}\n")
              f.write(f"- total vulnerable deps: {len(data.get('dependencies', []))}\n")
              f.write(f"- HIGH/CRITICAL findings: {len(highs)}\n\n")
              if highs:
                  f.write("## Findings\n\n")
                  for d in highs:
                      for v in d.get("vulns", []):
                          f.write(f"- **{d['name']}=={d['version']}** — {v.get('id')}: {v.get('description','')[:200]}\n")
          print(open("summary.md").read())
          PY
        env:
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}

      - name: Open or update issue on HIGH/CRITICAL findings
        if: steps.audit.outputs.exit_code != '0'
        uses: peter-evans/create-or-update-issue@v4
        with:
          title: "[Security] pip-audit found HIGH/CRITICAL vulnerabilities"
          body-file: summary.md
          labels: security,dependencies
