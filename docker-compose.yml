# ─────────────────────────────────────────────────────────────────────────────
# MRTO — Methanol Reformer Tube & Operation Optimizer
# Full-stack deployment (backend + reverse proxy + healthcheck)
# Usage:
#   MRTO_IMAGE=ghcr.io/parsasohrab1/inno-marjan-petrochemical-:latest \
#   MRTO_JWT_SECRET=$(openssl rand -hex 32) \
#   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────
name: mrto

services:
  backend:
    image: ${MRTO_IMAGE:-ghcr.io/parsasohrab1/inno-marjan-petrochemical-:latest}
    container_name: mrto-backend
    environment:
      MRTO_DB_PATH: ${MRTO_DB_PATH:-/app/data/mrto.sqlite3}
      MRTO_MODELS_DIR: ${MRTO_MODELS_DIR:-/app/models}
      MRTO_JWT_SECRET: ${MRTO_JWT_SECRET:-change-me-in-production}
      MRTO_ADMIN_USER: ${MRTO_ADMIN_USER:-admin}
      MRTO_ADMIN_PASS: ${MRTO_ADMIN_PASS:-admin123}
      ENV: ${ENV:-production}
    volumes:
      - backend-data:/app/data
      - models:/app/models
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - mrto-net

  # Frontend is a static HTML dashboard served by nginx alongside the reverse proxy.
  # The same nginx container serves / (dashboard) and proxies /api → backend.
  proxy:
    image: nginx:1.27-alpine
    container_name: mrto-proxy
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${MRTO_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - mrto-net

volumes:
  backend-data:
  models:

networks:
  mrto-net:
    driver: bridge
