[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=mrto --cov-report=term-missing --cov-report=html --cov-report=xml
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    network: marks tests requiring internet
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
