# ─────────────────────────────────────────────────────────────────────────────
# MRTO nginx reverse proxy + static dashboard
# Serves the React/Vanilla dashboard at / and proxies /api → backend:8000
# ─────────────────────────────────────────────────────────────────────────────
upstream mrto_backend {
    server backend:8000;
    keepalive 32;
}

# Rate-limit zone (per-IP, 10 r/s burst 20)
limit_req_zone $binary_remote_addr zone=mrto_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=mrto_static:10m rate=30r/s;

server {
    listen 80 default_server;
    server_name _;
    charset utf-8;
    client_max_body_size 20m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Root → static dashboard (frontend/index.html)
    root /usr/share/nginx/html;
    index index.html;

    # Internal healthcheck endpoint (cheap, no upstream)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API → backend (FastAPI)
    location /api/ {
        limit_req zone=mrto_api burst=20 nodelay;
        proxy_pass http://mrto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OpenAPI docs
    location = /docs { proxy_pass http://mrto_backend/docs; }
    location = /openapi.json { proxy_pass http://mrto_backend/openapi.json; }

    # Static dashboard — SPA fallback
    location / {
        limit_req zone=mrto_static burst=40 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
}
